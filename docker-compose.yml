# Tantush production stack
#
#   Cloudflare (CDN, WAF, DDoS) ──► nginx (TLS, rate limits, cache, load balancer)
#        ├─► storefront ×2  (Next.js)
#        └─► medusa-server ×2 (API + admin)      medusa-worker ×1 (jobs, events)
#                  └──────────► postgres + redis (private network only)
#
# Usage: see docs/DEPLOYMENT.md
#   docker compose build
#   docker compose run --rm medusa-migrate
#   docker compose up -d

name: tantush

x-medusa-env: &medusa-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
  STORE_CORS: https://${SHOP_DOMAIN}
  ADMIN_CORS: https://${API_DOMAIN}
  AUTH_CORS: https://${SHOP_DOMAIN},https://${API_DOMAIN}
  MEDUSA_BACKEND_URL: https://${API_DOMAIN}
  TRUST_PROXY: "true"
  MEDUSA_DISABLE_TELEMETRY: "true"
  STOREFRONT_URL: https://${SHOP_DOMAIN}
  ORDER_ACCESS_SECRET: ${ORDER_ACCESS_SECRET:?set ORDER_ACCESS_SECRET}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  COD_MAX_ORDER_TOTAL: ${COD_MAX_ORDER_TOTAL:-50000}
  MAX_QTY_PER_LINE: ${MAX_QTY_PER_LINE:-10}
  LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-3}
  SHOP_NOTIFY_TO: ${SHOP_NOTIFY_TO:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_FILE_URL: ${S3_FILE_URL:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks: [data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    cap_add: [SETGID, SETUID]
    # noeviction: Redis also holds BullMQ job queues, which must never be evicted
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 768mb
      --maxmemory-policy noeviction
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-off: run DB migrations (and on first install, the seed). Never runs on its own.
  medusa-migrate:
    image: tantush/backend:latest
    build: ./backend
    profiles: [tools]
    environment:
      <<: *medusa-env
      MEDUSA_WORKER_MODE: server
    command: ["npx", "medusa", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [data]

  medusa-server:
    <<: *hardening
    image: tantush/backend:latest
    build: ./backend
    environment:
      <<: *medusa-env
      MEDUSA_WORKER_MODE: server
    deploy:
      replicas: ${MEDUSA_SERVER_REPLICAS:-2}
      resources:
        limits: { memory: 2g }
    volumes:
      - uploads:/app/static
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [data, edge]

  medusa-worker:
    <<: *hardening
    image: tantush/backend:latest
    build: ./backend
    environment:
      <<: *medusa-env
      MEDUSA_WORKER_MODE: worker
      MEDUSA_ADMIN_DISABLED: "true"
    deploy:
      replicas: 1
      resources:
        limits: { memory: 1536m }
    volumes:
      - uploads:/app/static
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # edge gives outbound internet for SMS / email providers
    networks: [data, edge]

  storefront:
    <<: *hardening
    image: tantush/storefront:latest
    build:
      context: ./storefront
      args:
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:?set MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: https://${SHOP_DOMAIN}
        NEXT_PUBLIC_DEFAULT_REGION: bd
        NEXT_PUBLIC_MEDIA_URL: ${MEDIA_URL:-https://${API_DOMAIN}}
        NEXT_PUBLIC_SHOP_PHONE: ${SHOP_PHONE:-}
        NEXT_PUBLIC_SHOP_EMAIL: ${SHOP_EMAIL:-}
        NEXT_PUBLIC_FACEBOOK_URL: ${FACEBOOK_URL:-}
        NEXT_PUBLIC_INSTAGRAM_URL: ${INSTAGRAM_URL:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        MEDUSA_BACKEND_URL: http://nginx-internal:9000
    environment:
      MEDUSA_BACKEND_URL: http://nginx-internal:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      SERVER_ACTIONS_ALLOWED_ORIGINS: ${SHOP_DOMAIN}
      ORDER_ACCESS_SECRET: ${ORDER_ACCESS_SECRET}
    deploy:
      replicas: ${STOREFRONT_REPLICAS:-2}
      resources:
        limits: { memory: 1g }
    depends_on: [nginx-internal]
    networks: [edge]

  # Internal load balancer the storefront uses to reach the API replicas
  # (keeps server-to-server traffic off the public internet).
  nginx-internal:
    <<: *hardening
    image: nginx:1.28-alpine
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    volumes:
      - ./infra/nginx/internal.conf:/etc/nginx/nginx.conf:ro
    depends_on: [medusa-server]
    networks: [edge]

  nginx:
    <<: *hardening
    image: nginx:1.28-alpine
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      NGINX_ENVSUBST_FILTER: "^(SHOP_DOMAIN|API_DOMAIN)$$"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/templates:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - nginxcache:/var/cache/nginx
    depends_on: [storefront, medusa-server]
    networks: [edge]

  # Nightly AES-256 encrypted pg_dump with retention (see infra/backup)
  backup:
    <<: *hardening
    build: ./infra/backup
    image: tantush/backup:latest
    # host folder must be owned by uid 70: sudo install -d -o 70 -g 70 -m 700 backups
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]

networks:
  # Database tier is never reachable from the internet-facing tier
  data:
    internal: true
  edge: {}

volumes:
  pgdata:
  redisdata:
  uploads:
  nginxcache:

# Public edge: TLS termination (Cloudflare origin cert), real-IP restore,
# rate limiting, caching and load balancing across replicas.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  types_hash_max_size 4096;

  # ---- Slowloris / oversized request protection
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  client_body_buffer_size 32k;
  client_header_buffer_size 2k;
  large_client_header_buffers 4 16k;
  client_max_body_size 1m;

  # ---- Real visitor IP (only trusted from Cloudflare's ranges)
  include /etc/nginx/templates/cloudflare-ips.conf;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time '
                  'up=$upstream_addr ust=$upstream_status cache=$upstream_cache_status '
                  'cf_ray=$http_cf_ray';
  access_log /var/log/nginx/access.log main buffer=32k flush=5s;
  error_log  /var/log/nginx/error.log warn;

  # ---- Compression (Cloudflare adds Brotli at the edge)
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/javascript
             application/xml image/svg+xml application/manifest+json;

  # ---- Rate limiting zones (per real client IP)
  limit_req_zone  $binary_remote_addr zone=pages:20m    rate=15r/s;
  limit_req_zone  $binary_remote_addr zone=api:20m      rate=30r/s;
  limit_req_zone  $binary_remote_addr zone=auth:10m     rate=10r/m;
  limit_req_zone  $binary_remote_addr zone=checkout:10m rate=6r/m;
  limit_req_zone  $binary_remote_addr zone=admin:10m    rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=perip:20m;
  limit_req_status 429;
  limit_conn_status 429;

  # ---- Micro/static caches
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:50m max_size=2g inactive=30d use_temp_path=off;
  proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:50m max_size=4g inactive=30d use_temp_path=off;

  # ---- Upstreams (Docker DNS resolves to every replica)
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream storefront {
    zone storefront 64k;
    least_conn;
    server storefront:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  upstream medusa_api {
    zone medusa_api_edge 64k;
    least_conn;
    server medusa-server:9000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  map $uri $api_no_store {
    ~^/(auth|admin|app)(/|$)                                             "no-store";
    ~^/store/(customers|carts|orders|payment-collections|email-verification) "no-store";
    default "";
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # ---- TLS (Cloudflare "Full (strict)" with an Origin Certificate)
  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:20m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  # Authenticated Origin Pulls: only Cloudflare can complete the TLS handshake.
  # Download https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
  # into infra/nginx/certs/ and uncomment:
  # ssl_client_certificate /etc/nginx/certs/authenticated_origin_pull_ca.pem;
  # ssl_verify_client on;

  # Templates in /etc/nginx/templates are rendered into conf.d with envsubst
  include /etc/nginx/conf.d/tantush.conf;
}

# Internal load balancer: storefront containers -> Medusa API replicas.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
  server_tokens off;
  access_log off;
  # Docker's DNS; re-resolve so scaled replicas are picked up
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream medusa_api {
    zone medusa_api 64k;
    least_conn;
    server medusa-server:9000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 9000;
    client_max_body_size 1m;
    location / {
      proxy_pass http://medusa_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }
  }
}
